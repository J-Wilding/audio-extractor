<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Extractor Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 360px;
      background: #f7f7f9;
      color: #222;
      box-sizing: border-box;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      background: #fff;
      font-family: Menlo, Monaco, Consolas, monospace;
    }
    input:focus {
      outline: none;
      border-color: #2b6cb0;
      box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.2);
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      line-height: 1.35;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #2c5282;
    }
    button.secondary {
      background: #e2e8f0;
      color: #1a202c;
    }
    button.secondary:hover {
      background: #cbd5e1;
    }
    #status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.35;
      display: none;
      word-break: break-word;
    }
    #status.ok {
      display: block;
      background: #def7ec;
      color: #03543f;
      border: 1px solid #bcf0da;
    }
    #status.err {
      display: block;
      background: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
    }
    #status.info {
      display: block;
      background: #e1effe;
      color: #1e429f;
      border: 1px solid #b4c6fc;
    }
  </style>
</head>
<body>
  <h2>⚙️ Audio Extractor Server</h2>

  <div class="field">
    <label for="server-url">Server URL</label>
    <input type="text" id="server-url" placeholder="http://10.0.0.69:47821">
    <div class="hint">Your NAS server address (e.g. <code>http://10.0.0.69:47821</code>).</div>
  </div>

  <div class="field">
    <label for="token">Bridge Token</label>
    <input type="password" id="token" placeholder="Paste BRIDGE_TOKEN from server .env">
    <div class="hint">Must match <code>BRIDGE_TOKEN</code> configured on the server.</div>
  </div>

  <div class="btn-row">
    <button type="button" class="secondary" id="test-btn">Test Connection</button>
    <button type="button" id="save-btn">Save Settings</button>
  </div>

  <div id="status"></div>

  <script type="module" src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Extractor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 14px;
      width: 320px;
      background: #fafafa;
      color: #1a1a1a;
      box-sizing: border-box;
      font-size: 13px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e0e0e0;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .options-link {
      font-size: 12px;
      color: #0066cc;
      text-decoration: none;
      cursor: pointer;
    }
    .options-link:hover {
      text-decoration: underline;
    }
    .url-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 4px;
    }
    .badge.song { background: #e3f2fd; color: #0d47a1; }
    .badge.album { background: #e8f5e9; color: #1b5e20; }
    .badge.playlist { background: #fff3e0; color: #e65100; }
    .badge.invalid { background: #ffebee; color: #b71c1c; }

    .url-text {
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #555;
      word-break: break-all;
      max-height: 40px;
      overflow-y: auto;
    }

    .choice-group {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .choice-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #222; }
    .btn:disabled {
      background: #ccc;
      color: #777;
      cursor: not-allowed;
    }

    #status-area {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f0f0;
      border: 1px solid #e0e0e0;
      min-height: 24px;
      word-break: break-word;
    }
    #status-area.error {
      background: #fde8e8;
      border-color: #f8b4b4;
      color: #9b1c1c;
    }
    #status-area.success {
      background: #def7ec;
      border-color: #bcf0da;
      color: #03543f;
    }
    #status-area.info {
      background: #e1effe;
      border-color: #b4c6fc;
      color: #1e429f;
    }

    .progress-bar-container {
      margin-top: 8px;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #000;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Audio Extractor</h1>
    <a href="#" class="options-link" id="options-btn">Settings ⚙️</a>
  </header>

  <div class="url-card" id="url-card">
    <div id="type-badge" class="badge invalid">Inspecting...</div>
    <div class="url-text" id="target-url">Reading active tab...</div>
    <div id="choice-container" class="choice-group" style="display: none;">
      <label>
        <input type="radio" name="url_choice" value="song" checked> Extract single track
      </label>
      <label>
        <input type="radio" name="url_choice" value="playlist"> Extract entire playlist
      </label>
    </div>
  </div>

  <button class="btn" id="extract-btn" disabled>Send to Audio Extractor</button>

  <div class="progress-bar-container" id="progress-container">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="status-area">Ready</div>

  <script src="popup.js"></script>
</body>
</html>

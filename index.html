<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri App</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <div class="mac-menu-bar">
    <span class="menu-item apple-icon"></span>
    <span class="menu-item">File</span>
    <span class="menu-item">Edit</span>
    <span class="menu-item" id="view-btn">View</span>
    <span class="menu-item" id="update-btn">Check for Updates</span>
    <span class="menu-item" id="bridge-btn">Browser Bridge</span>
    <span class="menu-item" id="plex-scan-btn">Scan Plex</span>
    <span class="menu-item" id="settings-btn">Settings ⚙️</span>
  </div>
  <main class="mac-body">
    <div class="container">
      <h1>Audio Extractor</h1>
      <p>Paste a YouTube URL below to extract high-quality audio directly to your NAS.</p>

      <form class="row" id="extract-form">
        <input id="url-input" type="url" placeholder="https://youtube.com/watch?v=..." required
          style="flex-grow: 1; padding: 0.5rem; margin-right: 0.5rem;" />
        <button type="submit">Extract Audio</button>
      </form>
      
      <div id="progress-container" style="display: none; margin-top: 1.5rem; margin-bottom: 1.5rem; padding: 0 1rem; padding-bottom: 1rem;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: bold; color: #000;">
          <span id="progress-text">Downloading...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div id="progress-track" style="width: 100%; height: 20px; border: 2px solid #000; background-color: #fff; box-shadow: 2px 2px 0 #000;">
          <div id="progress-fill" style="width: 0%; height: 100%; background-color: #000; transition: width 0.1s linear;"></div>
        </div>
      </div>

      <p id="status-msg"></p>
    </div>
    <div class="mac-bottom">
      <div class="floppy-drive">
        <div class="floppy-slot"></div>
        <div class="floppy-button"></div>
      </div>
    </div>
  </main>

  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <span>Audio Extractor Settings</span>
        <button id="close-settings-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-content">
        <label for="cfg-plex-token">Plex Token</label>
        <input type="password" id="cfg-plex-token" placeholder="Paste your Plex token..." />

        <label for="cfg-plex-url">Plex Server URL</label>
        <input type="text" id="cfg-plex-url" />

        <label for="cfg-section-id">Plex Music Section ID</label>
        <input type="text" id="cfg-section-id" />

        <label for="cfg-mac-music-root">Mac Music Path</label>
        <input type="text" id="cfg-mac-music-root" />

        <label for="cfg-plex-music-root">Plex Server Music Path</label>
        <input type="text" id="cfg-plex-music-root" />

        <label for="cfg-playlists-dir">Playlists Output Directory</label>
        <input type="text" id="cfg-playlists-dir" />

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.2rem;">
          <button type="button" id="cancel-settings-btn">Cancel</button>
          <button type="button" id="save-settings-btn" style="background-color: #000; color: #fff;">Save Settings</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
